swagger: '2.0'
info:
  title: DA-KBA-BR
  description: The Quiz Antifraud (Knowledge Based Authentication) application is an anti fraud quiz based on personal information that aims to authenticate a person who is starting a high risk transaction.
  version: 1.0.17
  contact:
    name:  IDF – Squad Step Up
    email: IDF.StepUp@br.experian.com
host: sandbox-api.serasaexperian.com.br
basePath: /kba/v1
tags:
  - name: Quiz
    description: Allows Quizzes registration.
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json

securityDefinitions:
  OauthSecurityUser:
    type: oauth2
    flow: password
    tokenUrl: https://sandbox-api.serasaexperian.com.br/security/iam/v1/user-identities/login
    scopes:
      read: User read scope
      write: User write scope
  OauthSecurityClient:
    type: oauth2
    flow: application
    tokenUrl: https://sandbox-api.serasaexperian.com.br/security/iam/v1/client-identities/login
    scopes:
      read: Client read scope
      write: Client write scope

paths:
  #------------------------------------ QUIZ------------------------------------#
  '/quizzes':
    post:
      tags:
        - Quiz
      summary: It retrieves all customer's quizzes
      description: Allows to retrieve all registered quizzes. Could be filtered by id, cpf, email, customId (custom customer identification), answered, avaliableAt and/or answeredAt
      operationId: getAllQuizzes
      produces:
        - application/json
      security:
        - OauthSecurityUser:
            - read
      parameters:
        - in: body
          name: quizRequest
          description: QuizRequest Information
          schema:
            $ref: '#/definitions/QuizRequest'
          required: true
      responses:
        '201':
          description: Records Found Successfully.
          schema:
            type: array
            items:
              $ref: '#/definitions/Quiz'

        '400':
          description: |
            BadRequest
            This endpoint can throw the following error:
            * `[{"code": "400", "message": "MSG00017: Payload de requisição inválido. O atributo document está incorreto."}]`
          schema:
            $ref: '#/definitions/ErrorList'
        '401':
          description:  |
            Unauthorized
            This endpoint can throw the following error:
            * `[{"code": "401", "message": "Unauthorized."}]`
          schema:
            $ref: '#/definitions/ErrorList'
        '403':
          description:  |
            Forbidden 
            This endpoint can throw the following error:
            * `[{"code": "403", "message": "Forbidden ."}]`
          schema:
            $ref: '#/definitions/ErrorList'
        '404':
          description: |
            NotFound
            This endpoint can throw the following error:
            * `[{"code": "404", "message": "Not Found"}]`
          schema:
            $ref: '#/definitions/ErrorList'
        '406':
          description: Not Acceptable
          schema:
            $ref: '#/definitions/ErrorList'
        '412':
          description: Precondition Failed
          schema:
            $ref: '#/definitions/ErrorList'
        '428':
          description: Precondition Required
          schema:
            $ref: '#/definitions/ErrorList'
        '429':
          description: Too Many Requests
          schema:
            $ref: '#/definitions/ErrorList'
        '431':
          description: Request Header Fields Too Large
          schema:
            $ref: '#/definitions/ErrorList'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorList'
        '502':
          description: Bad Gateway
          schema:
            $ref: '#/definitions/ErrorList'
        '503':
          description: Service Unavailable
          schema:
            $ref: '#/definitions/ErrorList'
        '504':
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/ErrorList'
        'default':
          description: Default

  '/quizzes/{id}':
    put:
      tags:
        - Quiz
      summary: It retrieves a ScoreRange from a quiz
      description: It allows to retrieve the Quiz ScoreRange.
      operationId: getScoreRangeByQuizId
      consumes:
        - application/json
      produces:
        - application/json
      security:
        - OauthSecurityClient:
            - write
      parameters:
        - in: path
          name: id
          description: Quiz id
          type: string
          required: true
        - in: body
          name: quizRequest
          description: QuizRequest Information
          schema:
            $ref: '#/definitions/Quiz'
          required: true

      responses:
        '204':
          description: No content
        '200':
          description: Record Found Successfully..
          schema:
            $ref: '#/definitions/ScoreRangeResponse'
        '400':
          description: |
            BadRequest
            This endpoint can throw the following error:
            * `[{"code": "400", "message": "MSG00017: Payload de requisição inválido. O atributo document está incorreto."}]`
          schema:
            $ref: '#/definitions/ErrorList'
        '401':
          description:  |
            Unauthorized
            This endpoint can throw the following error:
            * `[{"code": "401", "message": "Unauthorized."}]`
          schema:
            $ref: '#/definitions/ErrorList'
        '403':
          description:  |
            Forbidden 
            This endpoint can throw the following error:
            * `[{"code": "403", "message": "Forbidden ."}]`
          schema:
            $ref: '#/definitions/ErrorList'
        '404':
          description: |
            NotFound
            This endpoint can throw the following error:
            * `[{"code": "404", "message": "Not Found"}]`
          schema:
            $ref: '#/definitions/ErrorList'
        '406':
          description: Not Acceptable
          schema:
            $ref: '#/definitions/ErrorList'
        '412':
          description: Precondition Failed
          schema:
            $ref: '#/definitions/ErrorList'
        '428':
          description: Precondition Required
          schema:
            $ref: '#/definitions/ErrorList'
        '429':
          description: Too Many Requests
          schema:
            $ref: '#/definitions/ErrorList'
        '431':
          description: Request Header Fields Too Large
          schema:
            $ref: '#/definitions/ErrorList'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorList'
        '502':
          description: Bad Gateway
          schema:
            $ref: '#/definitions/ErrorList'
        '503':
          description: Service Unavailable
          schema:
            $ref: '#/definitions/ErrorList'
        '504':
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/ErrorList'
        'default':
          description: Default

#==================================DEFINITIONS===============================================#

definitions:

  ScoreRangeResponse:
    type: object
    properties:
      scoreRange:
        $ref: '#/definitions/ScoreRange'

  ScoreRange:
    type: object
    properties:
      id:
        type: string
      initValue:
        type: integer
        format: int32
      endValue:
        type: integer
        format: int32
      description:
        type: string
      score:
        type: integer
        format: int32

  QuizRequest:
    type: object
    properties:
      document:
        type: string
      policyId:
        type: string
      customId:
        type: string

  Quiz:
    type: object
    properties:
      id:
        type: string
      quizRequest:
        $ref: '#/definitions/QuizRequest'
      questions:
        type: array
        items:
          $ref: '#/definitions/Question'
      answered:
        type: boolean
      availableOn:
        type: string
        format: date-time
      answeredOn:
        type: string
        format: date-time
      email:
        type: string
      scoreRange:
        $ref: '#/definitions/ScoreRange'
      errorResponse:
        $ref: '#/definitions/ErrorResponse'

  Question:
    type: object
    properties:
      id:
        type: string
        example: '5e18dc2ebb086200080be0ca'
      description:
        type: string
        example: 'Qual o dia do seu aniversario'
      answers:
        type: array
        items:
          $ref: '#/definitions/Answer'
      assessment:
        type: integer
        format: int64

  Answer:
    type: object
    properties:
      id:
        type: string
        example: '#1'
      description:
        type: string
        example: '15'
      selected:
        type: boolean
        example: false

  ErrorResponse:
    type: object
    properties:
      date:
        type: string
        format: datetime
      error:
        type: string
      status:
        type: integer
        format: int64
      message:
        type: string
      path:
        type: string

  ErrorList:
    type: array
    items:
      $ref: '#/definitions/ErrorModel'
  ErrorModel:
    type: object
    properties:
      code:
        type: integer
        description: Error code.
        example: "01"
      message:
        type: string
        example: "message reference code error"
        description: Error description.